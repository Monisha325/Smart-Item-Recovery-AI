services:
  - type: web
    name: campus-lostandfound-ai
    env: python
    region: oregon
    # First deploy takes 5-10 min — PyTorch + model weights download (~500 MB).
    # Consider Railway (always-on) if you need zero cold-starts.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: NODE_ENV
        value: production
      - key: AI_SERVICE_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: BACKEND_URL
        sync: false
